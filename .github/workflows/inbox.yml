name: 팀 확인 대기 목록

# 누가 누구의 답을 기다리는지 고정 Issue "팀 확인 대기 목록"에 모은다(scripts/inbox.mjs, 11/9).
# Issue·PR에 글이 올라오면 바로, 새 커밋·리뷰는 한 시간마다 다시 만든다.
# PR 이벤트로는 돌리지 않는다(PR 검사 목록에 끼지 않게).
on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
  statuses: read

# 글이 연달아 올라오면 마지막 것만 돌린다
concurrency:
  group: inbox
  cancel-in-progress: true

jobs:
  inbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # 어떤 이벤트든 main의 스크립트로 돌린다
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 목록 고치기
        run: node scripts/inbox.mjs --update-issue
        env:
          GH_TOKEN: ${{ github.token }}
