name: CI

# PR을 올리거나 고칠 때마다 자동 검사를 돌린다. 통과해야 main에 머지할 수 있다.
on:
  pull_request:
  push:
    branches: [main]

# PR은 새로 푸시하면 앞의 검사를 멈추고 새 커밋만 검사한다.
# main은 커밋마다 따로 묶어서 끝까지 검사한다(PR을 연달아 머지해도 앞 검사가 "cancelled"로 멈추지 않게)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-main-{0}', github.sha) }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # ubuntu-latest는 2026-10-19부터 Ubuntu 26으로 바뀐다. 갑자기 깨지지 않게 버전을 고정한다
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # DB 테스트용 Postgres(PostGIS 포함). 검사할 때만 잠깐 띄우는 빈 DB라 개발 DB·키와 상관없다(docs/tech-guide.md 3-4)
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toori_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 코드 모양 검사
        run: npm run format:check
      - name: 린트
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 테스트
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/toori_test
      - name: 빌드
        run: npm run build

  # main 검사 결과 알림(11/13 nnoinn). 11/12에 PR 두 개가 각각 통과한 뒤 같이 머지되면서 main 검사가 실패했는데 바로 알아채지 못했다.
  # main 검사가 실패하면 "main 검사 실패" Issue를 열어(이미 열려 있으면 댓글) @nnoinn에게 알린다. 이 Issue는 "나에게 온 요청"
  # (npm run inbox, 세션 시작 브리핑)에 올라간다. 다음 main 검사가 통과하면 저절로 닫는다.
  # PR을 연달아 머지하면 main 검사 여러 개가 순서 없이 끝나므로, 지금 main 맨 끝 커밋의 검사만 판단한다(앞 커밋 검사는 건너뛴다)
  main-alert:
    name: main 검사 결과 알림
    needs: check
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - name: 실패하면 알림 Issue 열기, 통과하면 닫기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.check.result }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          latest=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$latest" != "$SHA" ]; then
            echo "main 맨 끝 커밋이 아니라서 건너뛴다(그 커밋의 검사가 판단한다)"
            exit 0
          fi
          title="main 검사 실패"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          short=${SHA::7}
          if [ "$RESULT" = "failure" ]; then
            body="@nnoinn main 검사가 실패했어요(커밋 $short). 다음 PR을 머지하기 전에 먼저 고쳐 주세요. 검사 기록: $RUN_URL"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ "$RESULT" = "success" ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "main 검사가 다시 통과했어요(커밋 $short). 저절로 닫아요."
          fi
