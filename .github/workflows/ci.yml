name: CI

# PR을 올리거나 고칠 때마다 자동 검사를 돌린다. 통과해야 main에 머지할 수 있다.
on:
  pull_request:
  push:
    branches: [main]

# PR은 새로 푸시하면 앞의 검사를 멈추고 새 커밋만 검사한다.
# main은 커밋마다 따로 묶어서 끝까지 검사한다(PR을 연달아 머지해도 앞 검사가 "cancelled"로 멈추지 않게)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-main-{0}', github.sha) }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # ubuntu-latest는 2026-10-19부터 Ubuntu 26으로 바뀐다. 갑자기 깨지지 않게 버전을 고정한다
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # DB 테스트용 Postgres(PostGIS 포함). 검사할 때만 잠깐 띄우는 빈 DB라 개발 DB·키와 상관없다(docs/tech-guide.md 3-4)
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toori_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 코드 모양 검사
        run: npm run format:check
      - name: 린트
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 테스트
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/toori_test
      - name: 빌드
        run: npm run build
